[project]
name = "homewatt"
version = "0.1.0"
description = "MHacks 26 Predictive Household Energy Tracker (TRS-HOMEWATT-001 v0.2)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Shamanth Shastry" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Step 5 onwards (CMP-09, CMP-11). Kept out of the base install so steps 1-4 install fast.
ml = ["torch>=2.2", "lightgbm>=4.3", "scikit-learn>=1.4"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
homewatt = "homewatt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homewatt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "needs_library: requires data/library built by `homewatt cmp00 build`",
  "needs_db: requires the owner token and the published SpacetimeDB database (HOMEWATT_TEST_DB=1)",
  "needs_torch: trains a seq2point net with PyTorch; run on its own (HOMEWATT_TEST_TORCH=1) because torch and LightGBM crash one macOS process together",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["B008", "E501"]
"src/homewatt/spacetime_cli.py" = ["B008", "E501"]
