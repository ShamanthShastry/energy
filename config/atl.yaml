# Annex A — Action Template Library (ATL). The complete action space of CMP-13.
# Adding a template is a TRS revision (Annex A) and a change here, nothing else. Removing one is a
# retirement: keep the row with retired: true so historical ledger rows still resolve.
version: 1
templates:
  - action_type: shift_out_of_peak
    shape: shift
    applies_to: [water_heater, hair_dryer, straightener, iron]
    params: {from: tariff_peak}
    search: {name: to_hour, min: 19, max: 23, step: 1}
    requires_tou: true
    requires_alert: false
    assumption: "assumes all peak-hour use of {appliance} moves to {to_hour}:00 or later"

  - action_type: hvac_setpoint_away
    shape: setpoint
    applies_to: [hvac]
    params: {sign: 1}            # +1 in cooling mode; -1 (heating) defined but inactive in V1 (A.3)
    search: {name: delta_c, min: 1, max: 3, step: 1}
    requires_tou: false
    requires_alert: false
    actuator: thermostat
    assumption: "assumes the thermostat is set {delta_c} °C warmer for the week"

  - action_type: hvac_precool        # v0.11: a tap installs this as a weekday schedule (TRS-19-10..12)
    shape: setpoint
    applies_to: [hvac]
    params: {schedule: precool, peak_warm_c: 2, weekdays_only: true}
    search:                           # adapts each week: the best length and depth for that week's weather
      - {name: pre_hours, min: 1, max: 3, step: 1}
      - {name: pre_cool_c, min: 0.5, max: 2, step: 0.5}
    requires_tou: true
    requires_alert: false
    actuator: thermostat
    assumption: "assumes the thermostat runs {pre_cool_c} °C cooler from {pre_start}:00 to {peak_start}:00 and {peak_warm_c} °C warmer until {peak_end}:00 on weekdays this week"

  - action_type: water_heater_setpoint
    shape: trim
    applies_to: [water_heater]
    params: {factor: 0.90}
    requires_tou: false
    requires_alert: false
    assumption: "assumes the water heater is set to 49 °C (120 °F)"

  - action_type: trim_standby
    shape: trim
    applies_to: [laptop, screen, lamp]
    params: {factor: 0.85}
    requires_tou: false
    requires_alert: false
    assumption: "assumes {appliance} is switched off at the wall when not in use"

  - action_type: fridge_service
    shape: maintenance
    applies_to: [fridge]
    params: {factor: 0.85}
    requires_tou: false
    requires_alert: true
    assumption: "assumes the fridge returns to its usual cycle after the coils are cleaned or the door seal fixed"
